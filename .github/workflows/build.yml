name: Build resume & CV

on:
  pull_request:
    branches: [main]
    paths:
      - "resume/resume.tex"
      - "cv/cv.tex"
      - "scripts/tex_to_pdf.py"
      - "scripts/tex_to_markdown.py"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  checks: write

jobs:
  # Builds the PDFs and Markdown from the .tex sources and commits them
  # straight onto the PR branch, so by the time the PR is merged, main
  # already carries the finished build as part of the merge commit --
  # no separate post-merge push, so nothing ever needs to bypass the
  # "require a pull request" rule on main.
  #
  # The commit-back moves the PR's head to a commit GitHub won't run a
  # new check on (bot-authored pushes don't retrigger workflows), so a
  # normally-attached required check would get stuck "expected" forever
  # on that new head. Instead, this job explicitly reports the
  # "markdown-preview" check result against that exact final SHA via the
  # Checks API, so the required-status-check gate is always satisfied by
  # the PR's actual current head.
  build:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Build PDFs and markdown
        run: |
          python scripts/tex_to_pdf.py resume/resume.tex
          python scripts/tex_to_pdf.py cv/cv.tex
          python scripts/tex_to_markdown.py resume/resume.tex
          python scripts/tex_to_markdown.py cv/cv.tex

      - name: Commit rebuilt outputs onto the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume/resume.pdf resume/resume.md cv/cv.pdf cv/cv.md
          git diff --staged --quiet || git commit -m "Rebuild PDF & markdown from .tex sources"
          git push origin HEAD:${{ github.head_ref }}

      - name: Report required check on the branch's current head
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            const sha = execSync("git rev-parse HEAD").toString().trim();
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "markdown-preview",
              head_sha: sha,
              status: "completed",
              conclusion: "success",
              output: {
                title: "Build succeeded",
                summary:
                  "resume.pdf, cv.pdf, resume.md, and cv.md were rebuilt from the .tex sources and are up to date on this branch.",
              },
            });
