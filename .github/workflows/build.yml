name: Build resume & CV

on:
  pull_request:
    branches: [main]
    paths:
      - "resume/resume.tex"
      - "cv/cv.tex"
      - "scripts/tex_to_markdown.py"
  push:
    branches: [main]
    paths:
      - "resume/resume.tex"
      - "cv/cv.tex"
      - "scripts/tex_to_pdf.py"
      - "scripts/tex_to_markdown.py"

permissions:
  contents: write

jobs:
  # Runs on every PR into main. No TeX involved -- just the pure-Python
  # markdown converter -- so it's fast, and it commits the rebuilt .md
  # straight onto the PR branch so the PR diff shows the actual rendered
  # output, not just the LaTeX source.
  markdown-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build markdown
        run: |
          python scripts/tex_to_markdown.py resume/resume.tex
          python scripts/tex_to_markdown.py cv/cv.tex

      - name: Commit rebuilt markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume/resume.md cv/cv.md
          git diff --staged --quiet || git commit -m "Rebuild markdown preview [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

  # Runs once a PR is merged into main. Full build -- installs TeX and
  # rebuilds both PDFs plus the canonical Markdown -- then commits the
  # result straight to main.
  build-pdf-and-markdown:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Build PDFs and markdown
        run: |
          python scripts/tex_to_pdf.py resume/resume.tex
          python scripts/tex_to_pdf.py cv/cv.tex
          python scripts/tex_to_markdown.py resume/resume.tex
          python scripts/tex_to_markdown.py cv/cv.tex

      - name: Commit rebuilt outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume/resume.pdf resume/resume.md cv/cv.pdf cv/cv.md
          git diff --staged --quiet || git commit -m "Rebuild PDF & markdown from merged .tex sources [skip ci]"
          git push origin HEAD:main
